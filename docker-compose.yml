version: '3.8'

services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - caseguard_net

  pii-service:
    build:
      context: ./pii-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    networks:
      - caseguard_net

  knowledge-service:
    build:
      context: ./knowledge-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=mongodb://mongo:27017/caseguard
      - PORT=5002
    depends_on:
      - mongo
    networks:
      - caseguard_net

  screener-service:
    build:
      context: ./screener-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    networks:
      - caseguard_net

  pattern-service:
    build:
      context: ./pattern-service
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - caseguard_net

  risk-service:
    build:
      context: ./risk-service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - caseguard_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/caseguard
      - JWT_SECRET=test-secret
      - PORT=5000
      - PII_SERVICE_URL=http://pii-service:5001
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:5002
      - SCREENER_SERVICE_URL=http://screener-service:5003
      - PATTERN_SERVICE_URL=http://pattern-service:5004
      - RISK_SERVICE_URL=http://risk-service:5005
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongo
      - pii-service
      - knowledge-service
      - screener-service
      - pattern-service
      - risk-service
    networks:
      - caseguard_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - caseguard_net

networks:
  caseguard_net:

volumes:
  mongo_data:
