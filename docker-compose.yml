version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: caseguard-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caseguard-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/caseguard?replicaSet=rs0
      - JWT_SECRET=supersecretjwtkey12345
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/usr/src/app/src

  screener-service:
    build:
      context: ./screener-service
      dockerfile: Dockerfile
    container_name: caseguard-screener-service
    environment:
      - NODE_ENV=development
    ports:
      - "5003:5003"
    volumes:
      - ./screener-service/src:/usr/src/app/src

  knowledge-service:
    build:
      context: ./knowledge-service
      dockerfile: Dockerfile
    container_name: caseguard-knowledge-service
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/caseguard?replicaSet=rs0
      - AWS_REGION=us-east-1
      - USE_MOCK_BEDROCK=true
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./knowledge-service/src:/usr/src/app/src

  pii-service:
    build:
      context: ./pii-service
      dockerfile: Dockerfile
    container_name: caseguard-pii-service
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/caseguard?replicaSet=rs0
      - AWS_REGION=us-east-1
      - USE_MOCK_COMPREHEND=true
      - USE_MOCK_KMS=true
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./pii-service/src:/usr/src/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caseguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  pattern-service:
    build:
      context: ./pattern-service
      dockerfile: Dockerfile
    container_name: caseguard-pattern-service
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=development
      - PORT=5004
      - USE_MOCK_LLM=true
    volumes:
      - ./pattern-service/src:/usr/src/app/src

volumes:
  mongodb_data:
